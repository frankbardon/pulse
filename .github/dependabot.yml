version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # The embedder smoke module is a separate Go module with its own
  # go.sum; it replaces the root module locally, so only its third-party
  # pins need watching.
  - package-ecosystem: gomod
    directory: /internal/embeddersmoke
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Published contrib adapter modules (OpenTelemetry, Prometheus). Each
  # replaces the root module locally; `make contrib` fails on an untidy
  # go.mod/go.sum, so a ROOT bump needs `make contrib-tidy` in its PR.
  - package-ecosystem: gomod
    directories:
      - /contrib/otelpulse
      - /contrib/prompulse
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
