name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Build with `make build`
        2. Run `bin/pulse <command> ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, JSON envelope output, or logs if available.
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Request / Input
      description: Relevant request JSON or input data (redact sensitive fields).
      render: json

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Library facade (pulse.go)
        - CLI (cmd/pulse)
        - Service / Orchestration
        - Processing (aggregators / attributes / filterers / groupers)
        - Encoding (.pulse format)
        - I/O (CSV / TSV / NDJSON / Parquet / Excel)
        - Descriptor (manifest / predict / inspect)
        - Skills pack
        - Errors / Codes
        - Filesystem (afero)
        - Other

  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: "1.26"

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14.5 / Ubuntu 24.04 / Windows 11"
