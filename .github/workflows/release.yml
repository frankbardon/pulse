name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  # verify reuses the branch's pre-merge CI instead of re-running it. A
  # successful ci.yml run passes when scripts/release-ci-reuse.sh accepts
  # its head commit: the tagged commit's TREE (a merge of an up-to-date
  # branch keeps the tree), or a tree that differs only in the script's
  # allowlist of paths no test, embed or build reads (roadmap release
  # notes, say). Without one, the ci job below runs the suite on the tag.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.match.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find a passing CI run that covers the tagged commit
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=false
          for sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --status success --limit 100 --json headSha --jq '.[].headSha' | sort -u); do
            if git cat-file -e "${sha}^{commit}" 2>/dev/null \
                && ./scripts/release-ci-reuse.sh "$sha" "$GITHUB_SHA"; then
              echo "Reusing CI that passed on ${sha} for ${GITHUB_SHA}"
              found=true
              break
            fi
          done
          echo "found=${found}" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    if: needs.verify.outputs.found != 'true'
    # A called workflow's jobs may not ask for more than the caller grants;
    # ci.yml's apidiff job declares pull-requests: read (it is skipped here,
    # but permissions are checked when the workflow loads).
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  # One job per platform, in parallel: each builds its archive with the
  # same script `make dist` runs (DIST_FLAGS picks the target and skips
  # the checksums) and uploads it as an artifact.
  dist:
    needs: [verify, ci]
    if: ${{ !cancelled() && (needs.verify.outputs.found == 'true' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    steps:
      # The version comes from the tag through ldflags, so no history is
      # needed here.
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build the release archive
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          make dist VERSION="$TAG" DIST_FLAGS="--target $TARGET --no-checksums"
          echo "ARTIFACT=dist-${TARGET%/*}-${TARGET#*/}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Gathers the six archives, writes checksums.txt over all of them (the
  # script refuses a missing archive) and publishes: the asset set is the
  # one `make dist` builds locally.
  release:
    needs: dist
    if: ${{ !cancelled() && needs.dist.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-dist.sh --checksums-only "$TAG" dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
          case "$TAG" in
            *-*) gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY" ;;
          esac

  # Lockstep contrib tags: contrib/<module>/<root tag> for every nested
  # module under contrib/, cut only after the root release succeeded.
  # The script commits each contrib `require pulse <tag>` bump on a
  # detached release commit (never pushed to a branch), verifies every
  # module resolves the published root tag without its replace, then
  # pushes the contrib tags atomically. The contrib tags do not match
  # this workflow's `v*.*.*` trigger, and get no GitHub Release of their
  # own, so the root release (pre-release flag, Latest) is untouched.
  # The explicit `if` matters: without it the implicit success() also
  # requires the skipped `ci` job (skipped whenever a passing ci.yml run
  # is reused, and an ancestor of this job through dist and release), so
  # the contrib tags were silently never cut.
  contrib:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Cut lockstep contrib tags
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-contrib.sh "$TAG" --push
