name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  # verify reuses the branch's pre-merge CI instead of re-running it: a
  # successful ci.yml run whose head commit has the tagged commit's TREE
  # (a merge of an up-to-date branch keeps the tree) passes. Without
  # one, the ci job below runs the suite on the tag.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.match.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find a passing CI run for the tagged tree
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          found=false
          for sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --status success --limit 100 --json headSha --jq '.[].headSha' | sort -u); do
            if git cat-file -e "${sha}^{commit}" 2>/dev/null \
                && [ "$(git rev-parse "${sha}^{tree}")" = "$tree" ]; then
              echo "CI passed on ${sha} (same tree as ${GITHUB_SHA})"
              found=true
              break
            fi
          done
          echo "found=${found}" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    if: needs.verify.outputs.found != 'true'
    # A called workflow's jobs may not ask for more than the caller grants;
    # ci.yml's apidiff job declares pull-requests: read (it is skipped here,
    # but permissions are checked when the workflow loads).
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify, ci]
    if: ${{ !cancelled() && (needs.verify.outputs.found == 'true' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        run: make dist VERSION="$TAG"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
          case "$TAG" in
            *-*) gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY" ;;
          esac

  # Lockstep contrib tags: contrib/<module>/<root tag> for every nested
  # module under contrib/, cut only after the root release succeeded.
  # The script commits each contrib `require pulse <tag>` bump on a
  # detached release commit (never pushed to a branch), verifies every
  # module resolves the published root tag without its replace, then
  # pushes the contrib tags atomically. The contrib tags do not match
  # this workflow's `v*.*.*` trigger, and get no GitHub Release of their
  # own, so the root release (pre-release flag, Latest) is untouched.
  # The explicit `if` matters: without it the implicit success() also
  # requires the skipped `ci` job (skipped whenever a passing ci.yml run
  # is reused), so the contrib tags were silently never cut.
  contrib:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Cut lockstep contrib tags
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-contrib.sh "$TAG" --push
