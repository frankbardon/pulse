name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "descriptor/testdata/payload-schema.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build documentation
        run: mdbook build docs

      # Publish the payload JSON Schema at the site root so its $id
      # (https://frankbardon.github.io/pulse/payload-schema.json) resolves.
      # The committed golden carries a trailing `// golden-hash:` line for
      # tamper detection; strip it so the served file is valid JSON. The
      # golden is regenerated + verified by `make test` on every PR, so no
      # Go toolchain is needed here.
      - name: Publish payload schema
        run: sed '/^\/\/ golden-hash:/d' descriptor/testdata/payload-schema.json > docs/book/payload-schema.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
