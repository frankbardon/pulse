name: CI

# CI runs on demand, not per push: local gates (`make lint`, `go test
# ./...`, `make smoke`, `make contrib`) cover a branch while it is built,
# and this workflow runs once on the finished branch before merge —
# `gh workflow run ci.yml --ref <branch>`. Its `lint` and `test (1.26)`
# check runs land on the branch head, which is what branch protection
# requires. release.yml reuses a passing run for the tagged tree and
# calls this workflow only when none exists.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      # The 30m per-package timeout is a stopgap while the root and
      # internal/service packages run near go test's 10m default.
      # test-heavy runs both test tiers (fast + `//go:build heavy`).
      - name: Test
        run: make test-heavy TESTFLAGS=-timeout=30m

      - name: Embedder smoke module
        run: make smoke

      - name: Contrib modules
        run: make contrib

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint
        run: make lint

  # docs builds the mdBook on every PR. The committed Analysis Guide
  # (docs/src/guide/**, generated by `make docs`) is kept current by
  # TestDocsGeneratedCurrent in the test job; this job catches a SUMMARY
  # splice or page that breaks the book before merge (docs.yml builds
  # only on a main push).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build documentation
        run: mdbook build docs
