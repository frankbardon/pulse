name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      # make test = test-main + test-heavy, split into two steps so the
      # heavy packages' pass-bar fits (HEAVY_TEST_PKGS) never share the
      # runner's CPUs with root / internal/service under go test's
      # 10-minute per-package timeout.
      - name: Test
        run: make test-main

      - name: Heavy tests (MMM pass bars)
        run: make test-heavy

      - name: Embedder smoke module
        run: make smoke

      - name: Contrib modules
        run: make contrib

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint
        run: make lint

  # docs builds the mdBook on every PR. The committed Analysis Guide
  # (docs/src/guide/**, generated by `make docs`) is kept current by
  # TestDocsGeneratedCurrent in the test job; this job catches a SUMMARY
  # splice or page that breaks the book before merge (docs.yml builds
  # only on a main push).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build documentation
        run: mdbook build docs
